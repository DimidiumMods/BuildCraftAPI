plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.95'
}

if (gradle.startParameter.taskNames.contains("checkstyle")) {
    apply plugin: "checkstyle"
}

ext.configFile = file "build.properties"
configFile.withReader {
    // Load config. It shall from now be referenced as simply config or project.config
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}

// NeoForge targets. build.properties may override these with the keys below.
ext.minecraft_version = config.minecraft_version ?: config.mc_version
ext.neo_version = config.neo_version ?: config.neo_version
ext.parchment_minecraft_version = config.parchment_minecraft_version ?: config.mc_version
ext.parchment_mappings_version = config.parchment_mappings_version ?: config.mappings_version

version = config.mod_version
group = "com.mod-buildcraft.api" // http://maven.apache.org/guides/mini/guide-naming-conventions.html

base {
    archivesName = "buildcraft-api" // [baseName]-[appendix]-[version]-[classifier].[extension]
}

// Minecraft 1.21.1 / NeoForge requires Java 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file("run")
        }
        server {
            server()
            gameDirectory = project.file("run")
            programArgument "--nogui"
        }
    }

    mods {
        "buildcraftapi" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "api"
        }
    }
}

if (gradle.startParameter.taskNames.contains("checkstyle")) {
    checkstyle {
        configFile = file("guidelines/buildcraft.checkstyle")
    }

    tasks.register("checkstyle") {
        dependsOn tasks.named("checkstyleMain")
    }
}

tasks.named("processResources", ProcessResources) {
    def replaceProperties = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            neo_version      : project.neo_version
    ]
    inputs.properties replaceProperties

    // Only expand the NeoForge mod metadata file (the 1.21.1 replacement for mcmod.info)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xmaxerrs" << "2000"
    options.compilerArgs << "-Xmaxwarns" << "2"
    options.compilerArgs << "-Xlint:all"
    options.compilerArgs << "-Xdiags:verbose"
}

javadoc {
    options.encoding = "UTF-8"
    options.setUse(true)
    options.addStringsOption("Xmaxerrs").setValue(["2000"])
    options.addStringsOption("Xmaxwarns").setValue(["2"])
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}